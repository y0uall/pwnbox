[package]
name = "pwnbox"
version = "0.8.0"
edition = "2024"
description = "Automated recon & enumeration for HackTheBox"
authors = ["uall"]
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "time", "fs", "sync", "signal"] }
clap = { version = "4", features = ["derive"] }
colored = "3"
anyhow = "1"
chrono = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
unicode-width = "0.2"
libc = "0.2"

[profile.release]
strip = true
lto = true
opt-level = "s"
